description: >
  List of private IP addresses in CIDR format.
columns:
  - main(cidr)*
  - comment
default_values:
  - ["10.0.0.0/8", "IPv4 private"]
  - ["127.0.0.0/8", "IPv4 loopback"]
  - ["169.254.0.0/16", "IPv4 link-local"]
  - ["172.16.0.0/12", "IPv4 private"]
  - ["192.168.0.0/16", "IPv4 private"]
  - ["100.64.0.0/10", "IPv4 carrier-grade"]
  - ["::1/128", "IPv6 loopback"]
  - ["fc00::/7", "IPv6 private"]
  - ["fe80::/10", "IPv6 link-local"]
